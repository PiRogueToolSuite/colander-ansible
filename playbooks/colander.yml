---
- name: Configure and deploy Colander
  hosts: colander
  gather_facts: no
  tasks:
    - import_role:
        name: colander
        tasks_from: checks
      tags: ["checks"]
    - import_role:
        name: colander
        tasks_from: docker-info
      tags: ["docker-info"]
    - import_role:
        name: colander
        tasks_from: configure
      tags: ["configure"]
    - import_role:
        name: colander
        tasks_from: deploy
      tags: ["deploy"]
    - import_role:
        name: colander
        tasks_from: summarize
      tags: ["summary"]
