# WIP/FIXME: keep in sync with other compose files.
x-base_env: &base_env
  USE_DOCKER: True
  COLANDER_BASE_URL: ${BASE_COLANDER_BASE_URL}
  THREATR_BASE_URL: ${BASE_THREATR_BASE_URL}
  CYBERCHEF_BASE_URL:  ${CYBERCHEF_BASE_URL} # FIXME, faudrait pouvoir utiliser simplement que le FQDDN
  ACME_EMAIL:  ${BASE_ACME_EMAIL}
  ADMIN_NAME:  ${BASE_ADMIN_NAME}
  ADMIN_EMAIL:  ${BASE_ADMIN_EMAIL}
  DJANGO_DEFAULT_FROM_EMAIL:  ${BASE_DJANGO_DEFAULT_FROM_EMAIL}
  EMAIL_HOST:  ${BASE_EMAIL_HOST}
  EMAIL_HOST_USER:  ${BASE_EMAIL_HOST_USER}
  EMAIL_HOST_PASSWORD:  ${BASE_EMAIL_HOST_PASSWORD}
  EMAIL_PORT:  ${BASE_EMAIL_PORT}
  EMAIL_USE_TLS:  ${BASE_EMAIL_USE_TLS}
  EMAIL_USE_SSL:  ${BASE_EMAIL_USE_SSL}
  LICENSE_ENABLED: True
  USE_MANDOLIN:  ${BASE_USE_MANDOLIN}
  USE_CYBERCHEF:  ${BASE_USE_CYBERCHEF}
  USE_THREATR:  ${BASE_USE_THREATR}
  USE_PLAYWRIGHT:  ${BASE_USE_PLAYWRIGHT}

x-threatr_env: &threatr_env
  DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
  REDIS_URL: "redis://redis:6379/0"
  DJANGO_SECURE_SSL_REDIRECT: "false"
  WEB_CONCURRENCY: "4"
  DJANGO_SETTINGS_MODULE: "config.settings.production"
  DJANGO_ACCOUNT_ALLOW_REGISTRATION: "False"
  DJANGO_ALLOWED_HOSTS: "${THREATR_DJANGO_ALLOWED_HOSTS}"
  DJANGO_SECRET_KEY: "${THREATR_DJANGO_SECRET_KEY}"
  DJANGO_ADMIN_URL: "${THREATR_DJANGO_ADMIN_URL}"

x-threater_postgres_env: &threater_postgres_env
  POSTGRES_HOST: "threatr-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "threatr"
  POSTGRES_USER: "{{ colander_vault.threatr_postgres_user }}"
  POSTGRES_PASSWORD: "{{ colander_vault.threatr_postgres_password }}"
  # Used by pg_ready, see the healthcheck in the Docker Compose file
  PGDATABASE: "threatr"
  PGUSER: "{{ colander_vault.threatr_postgres_user }}"

include:
  - compose-base.yml
  - compose-volumes.yml

services:
  traefik:
    depends_on:
      # TODO: cabler {% if flavor.use_threatr %}
      threatr-front:
        condition: service_healthy
  # colander-front:
  #   depends_on:
  #     threatr-front:
  #       condition: service_started

  # ----------------------------
  # Threatr: {{ flavor.use_threatr }}
  # ----------------------------
  # TODO: cabler {% if flavor.use_threatr %}
  # Web front
  threatr-front:
    image: "ghcr.io/piroguetoolsuite/threatr:${THREATR_IMAGE_VERSION:-latest}"
    restart: unless-stopped
    logging:
      driver: "${LOG_DRIVER:-json-file}"
      options:
        labels: colander.service.name,colander.service.type
    healthcheck:
      test: [ "CMD", "grep", "-q", ":1388", "/proc/net/tcp" ]
      interval: 30s
      timeout: 2s
      retries: 5
    networks:
      - backend
    depends_on:
      threatr-postgres:
        condition: service_healthy
      threatr-worker:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /start
    environment:
      # {{ stack.base.dot_env_file}}, {{ stack.services.threatr.dot_env_file}}, {{ stack.services.threatr_postgres.dot_env_file}}
      <<: [*base_env, *threatr_env, *threater_postgres_env]
    labels:
      com.centurylinklabs.watchtower.enable: true
      colander.service.name: threatr-front
      colander.service.type: web

  # Workers
  threatr-worker:
    image: "ghcr.io/piroguetoolsuite/threatr:${THREATR_IMAGE_VERSION:-latest}"
    restart: unless-stopped
    logging:
      driver: "${LOG_DRIVER:-json-file}"
      options:
        labels: colander.service.name,colander.service.type
    networks:
      - backend
    depends_on:
      threatr-postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /start-worker
    environment:
      # {{ stack.base.dot_env_file}}, {{ stack.services.threatr.dot_env_file}}, {{ stack.services.threatr_postgres.dot_env_file}}
      <<: [*base_env, *threatr_env, *threater_postgres_env]
    labels:
      com.centurylinklabs.watchtower.enable: true
      colander.service.name: threatr-worker
      colander.service.type: worker

  # Database
  threatr-postgres:
    build:
      context: .
      dockerfile: ./compose/postgres/Dockerfile
    restart: unless-stopped
    logging:
      driver: "${LOG_DRIVER:-json-file}"
      options:
        labels: colander.service.name,colander.service.type
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    volumes:
      # - production_threatr_postgres_data:/var/lib/postgresql/data
      # - production_threatr_postgres_backups:/backups
      # - threatr_postgres_data:/var/lib/postgresql/data
      - threatr_postgres_data:/var/lib/postgresql
      - threatr_postgres_backups:/backups
    environment:
      <<: *threater_postgres_env # {{ stack.services.threatr_postgres.dot_env_file}}
    labels:
      colander.service.name: threatr-postgres
      colander.service.type: database
