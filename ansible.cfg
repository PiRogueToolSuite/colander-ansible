[defaults]
nocows=1
roles_path=./roles
action_warnings=False
# https://github.com/geerlingguy/mac-dev-playbook/issues/236
stdout_callback = default
result_format = yaml

[privilege_escalation]
become_method=sudo
become_user=root

[ssh_connection]
pipelining = True

[diff]
# Always print diff when running ( same as always running with -D/--diff )
always = True
