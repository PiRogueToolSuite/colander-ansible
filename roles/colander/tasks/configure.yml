#     force: true

- name: Copy backup script
  become: false
  ansible.builtin.template:
    src: "./templates/scripts/backup.j2"
    dest: "{{ colander_installation_path }}/scripts/backup"
    force: true
    owner: "{{ ansible_user }}"
    mode: 0700

- name: Copy restore script
  become: false
  ansible.builtin.template:
    src: "./templates/scripts/restore.j2"
    dest: "{{ colander_installation_path }}/scripts/restore"
    force: true
    owner: "{{ ansible_user }}"
    mode: 0700

- name: "deploy ./docker/* to {{ colander_installation_path }}/compose/"
  # ansible.posix.synchronize:
  #   src: "{{ playbook_dir }}/../docker/"
  #   dest: "{{ colander_installation_path }}/compose/"
  #   delete: true
  #   use_ssh_args: true
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker/"
    dest: "{{ colander_installation_path }}/compose/"
    owner: "{{ ansible_user }}"
    mode: 0600

- name: Generate .env file
  become: false
  ansible.builtin.template:
    src: "./templates/dot_env_file.j2"
    dest: "{{ colander_installation_path }}/compose/.env"
    owner: "{{ ansible_user }}"
    mode: 0600

- name: "Deploy a compose-prod.yaml"
  ansible.builtin.template:
    src: "./templates/compose-prod.yaml.j2"
    dest: "{{ colander_installation_path }}/compose/compose-prod.yml"
    owner: "{{ ansible_user }}"
    mode: 0600
