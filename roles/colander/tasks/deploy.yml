- name: Start the whole stack
  community.docker.docker_compose_v2:
    project_src: "{{ colander_installation_path }}/compose"
    files: ["compose-prod.yml"]
    docker_host: "{{ docker_host }}"
    state: present
    remove_orphans: true
    pull: "always"

- name: "Create admin users on colander and threatr"
  include_tasks: "create_django_super_user.yml"
  loop:
    - service_name: "Colander"
      username: "{{ colander_vault.colander_admin_user }}"
      password: "{{ colander_vault.colander_admin_password }}"
      email: "{{ colander_vault.admin_email }}"
      docker_service: "colander-worker"
    - service_name: "Threatr"
      username: "{{ colander_vault.threatr_admin_user }}"
      password: "{{ colander_vault.threatr_admin_password }}"
      email: "{{ colander_vault.admin_email }}"
      docker_service: "threatr-worker"
