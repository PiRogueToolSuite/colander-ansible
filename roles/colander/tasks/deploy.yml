- name: Start the whole stack
  community.docker.docker_compose_v2:
    project_src: "{{ colander_installation_path }}/compose"
    files: ["compose-prod.yml"]
    docker_host: "{{ docker_host }}"
    state: present
    remove_orphans: true
    pull: "always"

- name: Create Colander admin user
  community.docker.docker_compose_v2_run:
    service: "colander-worker"
    project_src: "{{ colander_installation_path }}/compose"
    files: ["compose-prod.yml"]
    command: "/entrypoint python manage.py createsuperuser --noinput --username {{ colander_vault.colander_admin_user }} --email {{ colander_vault.admin_email }}"
    docker_host: "{{ docker_host }}"
    remove_orphans: true
    cleanup: true
    env:
      DJANGO_SUPERUSER_PASSWORD: "{{ colander_vault.colander_admin_password }}"
  register: command_result
  changed_when: command_result.rc == 0
  failed_when:
    - command_result.rc != 0
    - "'That username is already taken' not in command_result.stderr"

- name: Create Threatr admin user
  community.docker.docker_compose_v2_run:
    service: threatr-worker
    project_src: "{{ colander_installation_path }}/compose"
    files: ["compose-prod.yml"]
    command: "/entrypoint python manage.py createsuperuser --noinput --username {{ colander_vault.threatr_admin_user }} --email {{ colander_vault.admin_email }}"
    docker_host: "{{ docker_host }}"
    remove_orphans: true
    cleanup: true
    env:
      DJANGO_SUPERUSER_PASSWORD: "{{ colander_vault.threatr_admin_password }}"
  register: command_result
  changed_when: command_result.rc == 0
  failed_when:
    - command_result.rc != 0
    - "'That username is already taken' not in command_result.stderr"
  when: flavor.use_threatr
